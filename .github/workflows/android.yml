name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      PATH: /usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:${{ env.PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Убедимся, что стоят нужные компоненты SDK (и cmdline-tools latest)
      - name: Install/Update Android SDK components
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # Подкачаем Gradle 8.7 и сделаем wrapper в проекте
      - name: Download Gradle 8.7 and generate wrapper
        working-directory: ./VdsProxy
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.7/bin/gradle --version
          ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: ./VdsProxy
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VdsProxy-debug-apk
          path: VdsProxy/app/build/outputs/apk/debug/*.apk
