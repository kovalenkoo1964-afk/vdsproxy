name: Build Android APK

on:
  push:
    branches: [ main, master, fix/build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
      # JDK 17 обязателен для AGP 8.5.x
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Point project to Android SDK (create local.properties)
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > VdsProxy/local.properties

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Ensure SDK components (platform 34 + build-tools)
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        run: ./gradlew -p VdsProxy :app:assembleDebug --stacktrace --info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: VdsProxy/app/build/outputs/apk/debug/*.apk
