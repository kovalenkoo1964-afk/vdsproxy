name: Build Android APK
on:
  push: { branches: [ main, master, fix/build ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Можно оставить, но уже не обязательно — у нас есть wrapper
      #- name: Make gradlew executable
      #  run: chmod +x ./gradlew

      - name: Build Debug
        run: |
          ./gradlew -p VdsProxy :app:assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: VdsProxy/app/build/outputs/apk/debug/*.apk
